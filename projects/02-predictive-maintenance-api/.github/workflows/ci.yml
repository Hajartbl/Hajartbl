name: pdm-api CI

on:
  push:
    paths: ["projects/02-predictive-maintenance-api/**"]
  pull_request:
    paths: ["projects/02-predictive-maintenance-api/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/02-predictive-maintenance-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Train model
        run: python model/generate_data.py && python model/train.py
      - name: Run tests
        run: python -m pytest tests/ -q
