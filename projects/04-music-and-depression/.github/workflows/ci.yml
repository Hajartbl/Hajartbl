name: music-depression CI

on:
  push:
    paths: ["projects/04-music-and-depression/**"]
  pull_request:
    paths: ["projects/04-music-and-depression/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/04-music-and-depression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run tests (stats toolkit + pipeline smoke test)
        run: python -m pytest tests/ -q
